server:
    port: 7001
spring:
  application:
    name: jmz-file
  config:
    additional-location: classpath:/
    import:
      - optional:classpath:config.yml
      - optional:nacos:common.yml?group=${NACOS_NAMESPACE:dev}
      - optional:nacos:jmz-security.yml?group=${NACOS_NAMESPACE:dev}
  cloud:
    nacos:
      username: nacos
      password: nacos
      server-addr: ${jmz.game-boosting.nacos.server.url}:${jmz.game-boosting.nacos.server.port}
      config:
        namespace: ${NACOS_NAMESPACE:dev}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 10000
            read-timeout: 30000
      hystrix:
        enabled: true
      compression:
        request:
          enabled: true
        response:
          enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 0

oss:
  endpoint: https://oss-cn-guangzhou.aliyuncs.com
  accessKeyId: LTAI5tBVabjL2MbBNGqkbd5M
  accessKeySecret: hsE00J69KneEuw9roGKqc4XLYNfW22
  bucketName: game-boosting
  region: cn-guangzhou
  accessUrl: https://game-boosting.oss-cn-guangzhou.aliyuncs.com

data:
  redis:
    host: ${jmz.game-boosting.redis.url}
    port: ${jmz.game-boosting.redis.port}
    password: ${jmz.game-boosting.redis.password:}
    database: 1
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 5000ms
      shutdown-timeout: 5000ms
    timeout: 10000ms
    retry:
      max-attempts: 5
      delay: 1000ms

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG
