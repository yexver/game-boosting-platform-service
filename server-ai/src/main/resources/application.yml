server:
  port: 9000
spring:
  application:
    name: server-ai
  config:
    additional-location: classpath:/
    import:
      - optional:classpath:config.yml
      - optional:nacos:jmz-server-ai.yml?group=${NACOS_NAMESPACE:dev}
  cloud:
    nacos:
      username: nacos
      password: nacos
      server-addr: ${jmz.game-boosting.nacos.server.url}:${jmz.game-boosting.nacos.server.port}
      config:
        namespace: ${NACOS_NAMESPACE:dev}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 10000
            read-timeout: 30000
      hystrix:
        enabled: true
      compression:
        request:
          enabled: true
        response:
          enabled: true
  data:
    redis:
      host: ${jmz.game-boosting.redis.url}
      port: ${jmz.game-boosting.redis.port}
      password: ${jmz.game-boosting.redis.password:}
      database: 1
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms
        shutdown-timeout: 5000ms
      timeout: 10000ms
      retry:
        max-attempts: 5
        delay: 1000ms
  # DashScope (通义千问) AI 配置
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-511158a3874a4ad09da4b6ec85a01ef8}
      chat:
        options:
          model: qwen-plus

logging:
  level:
    com.jmz: DEBUG
    org.springframework.ai: DEBUG
