spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: '*'
            allowed-headers: '*'
            allowed-methods: '*'
            allow-credentials: true
      routes:
        - id: jmz-security
          uri: lb://jmz-security
          predicates:
            #- path=/security/** #短写法
            - name: Path
              args:
                pattern: /jmz-security/**
                match-trailing-slash: true #可匹配末尾的斜杠
          #order:
          filters:
            - RewritePath=/jmz-security/?(?<segment>.*), /$\{segment}
#      default-filters:
#        - AddResponseHeader=X-Response-Default-Foo, Default-Bar
        - id: jmz-file
          uri: lb://jmz-file
          predicates:
            #- path=/security/** #短写法
            - name: Path
              args:
                pattern: /jmz-file/**
                match-trailing-slash: true #可匹配末尾的斜杠
          #order:
          filters:
            - RewritePath=/jmz-file/?(?<segment>.*), /$\{segment}
        - id: server-user
          uri: lb://server-user
          predicates:
            #- path=/security/** #短写法
            - name: Path
              args:
                pattern: /server-user/**
                match-trailing-slash: true #可匹配末尾的斜杠
          #order:
          filters:
            - RewritePath=/server-user/?(?<segment>.*), /$\{segment}

        - id: server-order
          uri: lb://server-order
          predicates:
            #- path=/security/** #短写法
            - name: Path
              args:
                pattern: /server-order/**
                match-trailing-slash: true #可匹配末尾的斜杠
          #order:
          filters:
            - RewritePath=/server-order/?(?<segment>.*), /$\{segment}

        - id: server-account
          uri: lb://server-account
          predicates:
            - name: Path
              args:
                pattern: /server-account/**
                match-trailing-slash: true
          filters:
            - RewritePath=/server-account/?(?<segment>.*), /$\{segment}

        - id: server-ai
          uri: lb://server-ai
          predicates:
            - name: Path
              args:
                pattern: /server-ai/**
                match-trailing-slash: true
          filters:
            - RewritePath=/server-ai/?(?<segment>.*), /$\{segment}

        # WebSocket 路由（直接透传，不重写路径，因为后端端点也是 /ws）
        # 双跳 + 网关默认不向转发端带 sec-websocket* 头 → 浏览器若协商 deflate 而后端无扩展会 1002；显式去掉扩展头 + Nacos 同配置见 jmz-gateway-dev.yml
        - id: server-order-websocket
          uri: lb://server-order
          predicates:
            - Path=/ws,/ws/**
          filters:
            - RemoveRequestHeader=Sec-WebSocket-Extensions
