# ===========================================
# Nacos 配置 - AI服务配置 (jmz-server-ai.yml)
# 分组: dev
# ===========================================
spring:
  data:
    redis:
      host: ${jmz.game-boosting.redis.url}
      port: ${jmz.game-boosting.redis.port}
      password: ${jmz.game-boosting.redis.password:}
      database: 1
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms
        shutdown-timeout: 5000ms
      timeout: 10000ms
      retry:
        max-attempts: 5
        delay: 1000ms

  # DashScope (通义千问) AI 配置
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      chat:
        options:
          model: qwen-plus

logging:
  level:
    com.jmz: DEBUG
    org.springframework.ai: DEBUG
