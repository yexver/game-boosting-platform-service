# ===========================================
# Nacos 配置文件模板
# 使用说明：将以下配置添加到 Nacos 配置中心的 dev 组中
# ===========================================
#
# 配置列表：
# 1. common.yml        - 公共配置（Redis、Nacos地址等）
# 2. jmz-gateway-dev.yml  - 网关路由配置
# 3. jmz-security.yml  - 认证服务配置
# 4. jmz-server-user.yml - 用户服务配置
# 5. jmz-server-order.yml - 订单服务配置
# 6. jmz-server-account.yml - 账户服务配置
# 7. jmz-server-ai.yml  - AI服务配置
# 8. jmz-file.yml       - 文件服务配置
#
# ===========================================

# -------------------------------------------
# 1. common.yml - 公共配置
# -------------------------------------------
jmz:
  game-boosting:
    nacos:
      server:
        url: localhost
        port: 8848
    redis:
      url: localhost
      port: 6379
      password:

# -------------------------------------------
# 2. jmz-gateway-dev.yml - 网关路由配置
# -------------------------------------------
spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: '*'
            allowed-headers: '*'
            allowed-methods: '*'
      routes:
        - id: jmz-security
          uri: lb://jmz-security
          predicates:
            - name: Path
              args:
                pattern: /jmz-security/**
                match-trailing-slash: true
          filters:
            - RewritePath=/jmz-security/?(?<segment>.*), /$\{segment}
        - id: jmz-file
          uri: lb://jmz-file
          predicates:
            - name: Path
              args:
                pattern: /jmz-file/**
                match-trailing-slash: true
          filters:
            - RewritePath=/jmz-file/?(?<segment>.*), /$\{segment}
        - id: server-user
          uri: lb://server-user
          predicates:
            - name: Path
              args:
                pattern: /server-user/**
                match-trailing-slash: true
          filters:
            - RewritePath=/server-user/?(?<segment>.*), /$\{segment}
        - id: server-order
          uri: lb://server-order
          predicates:
            - name: Path
              args:
                pattern: /server-order/**
                match-trailing-slash: true
          filters:
            - RewritePath=/server-order/?(?<segment>.*), /$\{segment}
        - id: server-account
          uri: lb://server-account
          predicates:
            - name: Path
              args:
                pattern: /server-account/**
                match-trailing-slash: true
          filters:
            - RewritePath=/server-account/?(?<segment>.*), /$\{segment}
        - id: server-ai
          uri: lb://server-ai
          predicates:
            - name: Path
              args:
                pattern: /server-ai/**
                match-trailing-slash: true
          filters:
            - RewritePath=/server-ai/?(?<segment>.*), /$\{segment}

