spring:

  datasource:
    url: jdbc:mysql://localhost:3306/game-boosting-platform-jmz-service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5           # 最小空闲连接数（默认等于 max-pool-size）
      maximum-pool-size: 20     # 最大连接数（默认 10）
      connection-timeout: 5000  # 连接超时时间（毫秒）
      idle-timeout: 600000      # 空闲连接超时时间（默认 600000ms）
      max-lifetime: 1800000     # 连接最大生命周期（默认 1800000ms）
      pool-name: MyHikariPool   # 连接池名称


mybatis-plus:
  # 指定mapper.xml文件位置（支持通配符）
  mapper-locations: classpath*:/mappers/**/*Mapper.xml
  # 实体类所在包
  type-aliases-package: com.jmz.serveruser.entity
  # 其他配置
  configuration:
    map-underscore-to-camel-case: true  # 自动驼峰命名转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl